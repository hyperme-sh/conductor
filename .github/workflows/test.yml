name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    container:
      image: golang:1.25-bookworm
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Test
        run: go test ./...
      - name: Static linux binary
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w' -o conductor ./cmd/conductor
          ldd conductor > /tmp/ldd.txt 2>&1 || true
          grep -q 'not a dynamic executable' /tmp/ldd.txt

  packages:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    container:
      image: golang:1.25-bookworm
    steps:
      - name: Install packagers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl file git rpm
          curl -fsSL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          tar -C /tmp -xzf /tmp/nfpm.tar.gz nfpm
          install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Package
        run: bash packaging/package.sh
      - name: Upload packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hypermesh-conductor-linux
          path: dist/*
          if-no-files-found: error

  raw-binaries:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    container:
      image: golang:1.25-bookworm
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o "dist/conductor-${GOOS}-${GOARCH}${ext}" ./cmd/conductor
          ls -l "dist/conductor-${GOOS}-${GOARCH}${ext}"

  local-socket-native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Private socket unit contracts
        run: go test -race ./internal/localtransport
      - name: Parent supervision unit contracts
        run: go test -race ./internal/cli -run "TestWindowsRejectsUnixParentWatchBeforeConfig|TestManaged|TestParent"
      - name: Local proxy contract
        run: go test -race ./internal/proxy -run "TestPrivatePipeHTTPAndShutdown|TestLocalShutdownRemovesSocketAndAllowsRestart"

  runtime:
    concurrency:
      group: conductor-runtime-${{ github.ref }}
      cancel-in-progress: false
    needs: test
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build TEST runtime
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t ghcr.io/hyperme-sh/conductor/runtime:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT .
      - name: Runtime command contract
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges ghcr.io/hyperme-sh/conductor/runtime:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT --help
          test "$(docker image inspect ghcr.io/hyperme-sh/conductor/runtime:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT --format '{{.Config.User}}')" = 65532:65532
      - name: Runtime image unit contracts
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/hyperme-sh/conductor/runtime:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          contract_image="conductor-contracts:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          contract_dir=$(mktemp -d "$RUNNER_TEMP/conductor-contracts.XXXXXX")
          contract_container=""
          trap 'if [ -n "$contract_container" ]; then docker rm -f "$contract_container" >/dev/null; fi; docker image rm "$contract_image" >/dev/null 2>&1 || true; rm -rf "$contract_dir"' EXIT
          docker build -f Dockerfile.runtime-contracts -t "$contract_image" .
          contract_container=$(docker create "$contract_image")
          docker cp "$contract_container:/out/runtime-contract.test" "$contract_dir/contract.test"
          chmod 755 "$contract_dir" "$contract_dir/contract.test"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /bin/sh "$image" -ec 'test "$(stat -c %u:%g /var/lib/conductor)" = 65532:65532'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /var/lib/conductor:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700 \
            --mount "type=bind,src=$contract_dir/contract.test,dst=/contract.test,readonly" \
            -e CONDUCTOR_RUNTIME_CONTRACT=1 --entrypoint /contract.test "$image" -test.v
          docker image inspect "$image" --format 'Runtime architecture={{.Architecture}} size_bytes={{.Size}}' >> "$GITHUB_STEP_SUMMARY"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /sbin/apk "$image" info -v >> "$GITHUB_STEP_SUMMARY"
      - name: Publish moving TEST runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          current=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GHCR_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'Superseded main revision; leaving the TEST channel unchanged.'
            exit 0
          fi
          docker tag ghcr.io/hyperme-sh/conductor/runtime:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT ghcr.io/hyperme-sh/conductor/runtime:test
          docker push ghcr.io/hyperme-sh/conductor/runtime:test
